name: Build Docker Image

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: '镜像版本号（如 latest 或 1.0.0）'
        required: false
        default: 'latest'
        type: string
      push_image:
        description: '构建完成后推送镜像（否则仅验证构建）'
        required: false
        default: true
        type: boolean

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU（ARM 模拟）
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        if: github.event_name == 'push' || inputs.push_image == true
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 可选：同时推送到 Docker Hub（配置 DOCKERHUB_USERNAME / DOCKERHUB_TOKEN secrets 后自动启用）
      - name: Check Docker Hub config
        id: dh
        env:
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          if [ -n "$DH_USER" ]; then echo "enabled=1" >> $GITHUB_OUTPUT; else echo "enabled=0" >> $GITHUB_OUTPUT; fi

      - name: Login to Docker Hub
        if: (github.event_name == 'push' || inputs.push_image == true) && steps.dh.outputs.enabled == '1'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Determine version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="${{ inputs.version }}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION"

      - name: Build and push multi-arch image (GHCR)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' || inputs.push_image == true }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/trae-signin-web:latest
            ghcr.io/${{ github.repository_owner }}/trae-signin-web:${{ steps.ver.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push multi-arch image (Docker Hub)
        if: (github.event_name == 'push' || inputs.push_image == true) && steps.dh.outputs.enabled == '1'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/trae-signin-web:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/trae-signin-web:${{ steps.ver.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Inspect image
        if: github.event_name == 'push' || inputs.push_image == true
        run: |
          docker buildx imagetools inspect ghcr.io/${{ github.repository_owner }}/trae-signin-web:${{ steps.ver.outputs.version }}
